[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.159.1",
    "openai>=3.36.0",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "torch==2.14.1",
    "sentence-transformers==6.1.0",
    "qdrant-client>=1.19.1,<2",
    "jieba>=0.42.1,<1",
    "rank-bm25>=0.2.2,<0.3",
    "mcp>=2.3,<3",
    "httpx>=0.28.1",
    "langgraph>=1.2.14,<2",
    "langchain-core>=1,<2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
